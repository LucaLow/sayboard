name: Backend checks
on:
  pull_request:
    paths:
      - "backend/**"
      - "src/board.ts"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "src/board.ts"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/backend.yml"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run --prefix backend check
      - run: npm test
      - run: npm run build
